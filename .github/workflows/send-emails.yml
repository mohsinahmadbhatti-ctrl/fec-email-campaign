name: Send Emails (10 per hour)

on:
  workflow_dispatch:          # Triggered hourly by cron-job.org (GitHub's own
                              # cron scheduler is unreliable on free plans)

jobs:
  send:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # Needed to commit the updated contacts.csv back

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Send emails (with retry)
        env:
          SMTP_HOST:      mail.futureedge-consulting.com
          SMTP_PORT:      "465"
          IMAP_HOST:      mail.futureedge-consulting.com
          IMAP_PORT:      "993"
          FROM_EMAIL:     mohsin.bhatti@futureedge-consulting.com
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SENDER_NAME:    Mohsin
          BATCH_SIZE:     "10"
        run: |
          for attempt in 1 2 3; do
            echo "Attempt $attempt of 3..."
            python send_emails.py && break
            if [ $attempt -lt 3 ]; then
              echo "Failed. Waiting 180s before retry..."
              sleep 180
            else
              echo "All 3 attempts failed."
              exit 1
            fi
          done

      - name: Commit updated contacts.csv
        run: |
          git config user.name  "Lead Bot"
          git config user.email "bot@futureedge-consulting.com"
          git add contacts.csv
          git diff --staged --quiet || git commit -m "Mark sent contacts [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push
